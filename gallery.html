<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MASC Gallery</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
        }

        .gallery-page {
            min-height: 100vh;
            padding: 50px 30px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading p {
            color: #087f4b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .heading h1 {
            font-size: 40px;
            margin: 10px 0;
        }

        .heading span {
            color: #777;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 210px;

            object-fit: cover;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .back {
            text-align: center;
            margin-top: 35px;
        }

        .back a {
            display: inline-block;
            padding: 10px 22px;

            background: #087f4b;
            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

        @media (max-width: 800px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


    <section class="gallery-page">


        <div class="heading">

            <p>MOMENTS</p>

            <h1>MASC Gallery</h1>

            <span>
                Memories and moments from our club activities.
            </span>

        </div>


        <div class="gallery">

            <img src="images/516491.jpg" alt="Gallery">

            <img src="images/516493.jpg" alt="Gallery">

            <img src="images/516494.jpg" alt="Gallery">

            <img src="images/516497.jpg" alt="Gallery">

            <img src="images/516495.jpg" alt="Gallery">

            <img src="images/516503.jpg" alt="Gallery">

            <img src="images/516504.jpg" alt="Gallery">

            <img src="images/516505.jpg" alt="Gallery">

        </div>


        <div class="back">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </section>


</body>

</html>
