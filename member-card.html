<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MASC Member Card</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f3f6f4;
            min-height: 100vh;
        }

        .member-page {
            padding: 50px 15px;
        }

        .member-card {
            max-width: 520px;
            margin: auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: #198754;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        .club-name {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }

        .club-full-name {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.9;
        }

        .card-body {
            padding: 30px;
            text-align: center;
        }

        .member-photo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #198754;
            margin-bottom: 15px;
        }

        .member-name {
            color: #198754;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .member-role {
            color: #777;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .member-details {
            margin-top: 25px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 11px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .detail-value {
            color: #666;
            text-align: right;
        }

        .member-id {
            background: #eaf6ef;
            color: #198754;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            display: inline-block;
            margin-top: 15px;
        }

        .active-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 18px;
            border-radius: 30px;
            background: #198754;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .card-footer {
            background: #f8f9fa;
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #777;
        }

        @media print {

            body {
                background: white;
            }

            .no-print {
                display: none !important;
            }

            .member-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }

        }

    </style>

</head>


<body>


    <div class="member-page">

        <div class="member-card">


            <!-- Header -->

            <div class="card-header">

                <h1 class="club-name">
                    MASC
                </h1>

                <div class="club-full-name">
                    METRO MAPPILAKKAD ARTS AND SPORTS CLUB
                </div>

            </div>


            <!-- Body -->

            <div class="card-body">

                <img
                    id="memberPhoto"
                    class="member-photo"
                    src=""
                    alt="Member Photo">


                <h2
                    id="memberName"
                    class="member-name">
                    Member Name
                </h2>


                <div class="member-role">
                    CLUB MEMBER
                </div>


                <div
                    id="memberId"
                    class="member-id">
                </div>


                <div class="member-details">


                    <div class="detail-row">

                        <span class="detail-label">
                            Age
                        </span>

                        <span
                            id="memberAge"
                            class="detail-value">
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Phone
                        </span>

                        <span
                            id="memberPhone"
                            class="detail-value">
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Email
                        </span>

                        <span
                            id="memberEmail"
                            class="detail-value">
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Interest
                        </span>

                        <span
                            id="memberInterest"
                            class="detail-value">
                        </span>

                    </div>


                </div>


                <div class="active-badge">
                    ✓ ACTIVE MEMBER
                </div>

            </div>


            <!-- Footer -->

            <div class="card-footer">

                METRO MAPPILAKKAD ARTS AND SPORTS CLUB

            </div>


        </div>


        <!-- Buttons -->

        <div class="text-center mt-4 no-print">

            <a
                href="index.html"
                class="btn btn-outline-success me-2">
                Home
            </a>

            <button
                onclick="window.print()"
                class="btn btn-success">
                🖨 Print Member Card
            </button>

        </div>

    </div>


    <script src="member-card.js"></script>

</body>

</html>
