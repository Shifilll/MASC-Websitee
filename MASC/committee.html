<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MASC Committee</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Your Main CSS -->
    <link rel="stylesheet" href="style.css">

    <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7f6;
    }

    .committee-page {
        min-height: 100vh;
        padding: 45px 35px 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Heading */

    .committee-page-heading {
        text-align: center;
        margin-bottom: 28px;
    }

    .committee-page-heading .section-title {
        color: #087f4b;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 5px;
    }

    .committee-page-heading h1 {
        font-size: 36px;
        font-weight: 700;
        margin: 0 0 6px;
    }

    .committee-page-heading p:last-child {
        color: #777;
        margin: 0;
        font-size: 14px;
    }


    /* Committee Grid */

    .full-committee-grid {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
}

    /* Member Card */

    .full-member-card {
    width: calc(25% - 14px);

    background: white;
    border-radius: 14px;
    overflow: hidden;
    text-align: center;

    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);

    transition: 0.25s ease;
}
    .full-member-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }


    /* Images */

    .full-member-image {
        height: 165px;
        overflow: hidden;
        background: #e9eceb;
    }

    .full-member-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }


    /* Member Details */

    .full-member-info {
        padding: 12px 8px 14px;
    }

    .full-member-info h3 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 700;
    }

    .full-member-info p {
        margin: 0;
        color: #087f4b;
        font-size: 13px;
        font-weight: 600;
    }



    /* Back Button */

    .back-button {
        text-align: center;
        margin-top: 25px;
    }

    .back-button a {
        padding: 9px 22px;
        border-radius: 8px;
        font-size: 14px;
    }


    /* Tablet */

    @media (max-width: 900px) {

        .committee-page {
            padding: 35px 20px;
        }

        .full-committee-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .full-member-image {
            height: 140px;
        }

        .full-member-info h3 {
            font-size: 15px;
        }

        .full-member-info p {
            font-size: 11px;
        }

    }


    /* Mobile */

    @media (max-width: 650px) {

        .committee-page {
            padding: 30px 15px;
        }

        .committee-page-heading h1 {
            font-size: 28px;
        }

        .full-committee-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .full-member-card:nth-child(5),
        .full-member-card:nth-child(6),
        .full-member-card:nth-child(7) {
            grid-column: auto;
        }

        .full-member-image {
            height: 150px;
        }

    }
    /* FULL IMAGE VIEW */

.image-popup {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.85);

    z-index: 99999;

    align-items: center;
    justify-content: center;

    padding: 30px;
}

.image-popup img {
    max-width: 90%;
    max-height: 90vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}

.image-close {
    position: absolute;

    top: 20px;
    right: 30px;

    background: white;
    border: none;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    font-size: 30px;
    line-height: 1;

    cursor: pointer;

    z-index: 100000;
}

</style>

</head>


<body>


    <!-- Committee Page -->

    <section class="committee-page">

        <div class="committee-page-heading">

            <p class="section-title">
                OUR LEADERSHIP
            </p>

            <h1>
                MASC Committee
            </h1>

            <p>
                Meet the team behind
                Metro Mappilakkad Arts and Sports Club.
            </p>

        </div>


        <div class="full-committee-grid">


            <!-- President -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/IMG-20260926-WA0602.jpg"
                        alt="Naseer" onclick="openImage(this.src)">

                </div>

                <div class="full-member-info">

                    <h3>NASEER</h3>

                    <p>President</p>

                </div>

            </div>


            <!-- Vice President -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/IMG-20260806-WA0958.jpg"
                        alt="Praveen" onclick="openImage(this.src)">

                </div>

                <div class="full-member-info">

                    <h3>PRAVEEN</h3>

                    <p>Vice President</p>

                </div>

            </div>


            <!-- Secretary -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/IMG-20260926-WA0580(1).jpg"
                        alt="Musthafa" onclick="openImage(this.src)">

                </div>

                <div class="full-member-info">

                    <h3>MUSTHAFA</h3>

                    <p>Secretary</p>

                </div>

            </div>


            <!-- Vice Secretary -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/IMG-20260806-WA1040.jpg"
                        alt="Thangu" onclick="openImage(this.src)">

                </div>

                <div class="full-member-info">

                    <h3>THANGU</h3>

                    <p>Vice Secretary</p>

                </div>

            </div>


            <!-- Joint Secretary 1 -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/Screenshot_20260926-151535.png"
                        alt="Afsal" onclick="openImage(this.src)">
                </div>

                <div class="full-member-info">

                    <h3>AFSAL</h3>

                    <p>Joint Secretary</p>

                </div>

            </div>


            <!-- Joint Secretary 2 -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/Screenshot_20260926-151621.png"
                        alt="Thoufeeq" onclick="openImage(this.src)">

                </div>

                <div class="full-member-info">

                    <h3>THOUFEEQ</h3>

                    <p>Joint Secretary</p>

                </div>

            </div>


            <!-- Treasurer -->

            <div class="full-member-card">

                <div class="full-member-image">

                    <img
                        src="images/Screenshot_20260926-151603.png"
                        alt="Shifil" onclick="openImage(this.src)">

                </div>

                <div class="full-member-info">

                    <h3>SHIFIL</h3>

                    <p>Treasurer</p>

                </div>

            </div>


        </div>


        <!-- Back Button -->

        <div class="back-button">

            <a
                href="index.html"
                class="btn btn-success">

                ← Back to Home

            </a>

        </div>


    </section>

    <!-- FULL IMAGE POPUP -->

<div id="imagePopup" class="image-popup">

    <button class="image-close" onclick="closeImage()">
        ×
    </button>

    <img id="fullImage" src="" alt="Full Image">

</div>


<script>

function openImage(imageSrc) {

    document.getElementById("fullImage").src = imageSrc;

    document.getElementById("imagePopup").style.display = "flex";

}


function closeImage() {

    document.getElementById("imagePopup").style.display = "none";

}

</script>

</body>

</html>
