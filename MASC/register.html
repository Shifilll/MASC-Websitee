<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join MASC</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar bg-white border-bottom">

        <div class="container">

            <a
                href="index.html"
                class="navbar-brand fw-bold text-success">
                MASC
            </a>

            <a
                href="index.html"
                class="btn btn-outline-success">
                Back to Home
            </a>

        </div>

    </nav>


    <!-- Registration -->

    <section class="py-5">

        <div class="container">

            <!-- Heading -->

            <div class="text-center mb-5">

                <p class="text-success fw-bold mb-2">
                    BECOME A MEMBER
                </p>

                <h1 class="fw-bold">
                    Join MASC
                </h1>

                <p class="text-muted">
                    Become a part of Metro Mappilakkad
                    Arts and Sports Club.
                </p>

            </div>


            <!-- Form -->

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-6">

                    <div class="bg-white p-4 p-md-5 rounded-3 shadow-sm">

                        <form id="registrationForm">


                            <!-- Name -->

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    placeholder="Enter your full name">

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label fw-semibold">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    placeholder="Enter 10 digit phone number"
                                    maxlength="10">

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email">

                            </div>


                            <!-- Age -->

                            <div class="mb-3">

                                <label
                                    for="age"
                                    class="form-label fw-semibold">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="age"
                                    placeholder="Enter your age">

                            </div>


                            <!-- Interest -->

                            <div class="mb-3">

                                <label
                                    for="interest"
                                    class="form-label fw-semibold">
                                    Area of Interest
                                </label>

                                <select
                                    class="form-select"
                                    id="interest">

                                    <option value="">
                                        Select an option
                                    </option>

                                    <option value="Sports">
                                        Sports
                                    </option>

                                    <option value="Arts">
                                        Arts
                                    </option>

                                    <option value="Community">
                                        Community Activities
                                    </option>

                                    <option value="Volunteer">
                                        Volunteer
                                    </option>

                                </select>

                            </div>


                            <!-- Photo -->

                            <div class="mb-3">

                                <label
                                    for="photo"
                                    class="form-label fw-semibold">
                                    Profile Photo
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="photo"
                                    accept="image/*">

                            </div>


                            <!-- Address -->

                            <div class="mb-4">

                                <label
                                    for="address"
                                    class="form-label fw-semibold">
                                    Address
                                </label>

                                <textarea
                                    class="form-control"
                                    id="address"
                                    rows="3"
                                    placeholder="Enter your address"></textarea>

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Submit Registration

                            </button>


                            <!-- Message -->

                            <div
                                id="message"
                                class="text-center mt-3">
                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>
             <script src="script.js"></script>
</body>

</html>
